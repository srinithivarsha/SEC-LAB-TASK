<!DOCTYPE html>
<html>
<head>
  <title>Addition and Subtraction</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">
  <h2>Program 1: Implementing Operations (Addition & Subtraction)</h2>

  <label>Enter Number 1:</label>
  <input type="number" id="num1" placeholder="Enter first number"><br><br>

  <label>Enter Number 2:</label>
  <input type="number" id="num2" placeholder="Enter second number"><br><br>

  <button onclick="performOperations()">Calculate</button>

  <h3 id="result"></h3>

  <script>
    function add(num1, num2) {
      return num1 + num2;
    }

    function subtract(num1, num2) {
      return num1 - num2;
    }


    function performOperations() {
    
      let number1 = parseFloat(document.getElementById("num1").value);
      let number2 = parseFloat(document.getElementById("num2").value);

      if (isNaN(number1) || isNaN(number2)) {
        document.getElementById("result").innerHTML = "⚠️ Please enter valid numbers.";
        return;
      }

      let sum = add(number1, number2);
      let difference = subtract(number1, number2);

      document.getElementById("result").innerHTML =
        `Addition: ${number1} + ${number2} = ${sum}<br>` +
        `Subtraction: ${number1} - ${number2} = ${difference}`;
    }
  </script>
</body>
</html>
