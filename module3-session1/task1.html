<!DOCTYPE html>
<html>
<head>
<title>Advanced Array Methods</title>
</head>
<body>
<h2>Advanced Array Methods</h2>
<button onclick="runCode()">Run Code</button>
<p>In console</p>

<script>
function runCode() {
  console.clear();

  let numbers = [5, 10, 15, 20, 25, 30];
  console.log("Original array:", numbers);

  let filtered = numbers.filter(n => n > 10);
  console.log("Filtered (numbers > 10):", filtered);

  let sum = numbers.reduce((acc, n) => acc + n, 0);
  console.log("Sum using reduce:", sum);

  let product = numbers.reduce((acc, n) => acc * n, 1);
  console.log("Product using reduce:", product);

  let textArray = ["Hello", "World", "JS"];
  let sentence = textArray.reduce((acc, word) => acc + " " + word);
  console.log("Concatenated string:", sentence);

  let sliced = numbers.slice(1, 4);
  console.log("Sliced (1–3):", sliced);
  console.log("After slice, original array:", numbers);

  numbers.splice(2, 2, 100, 200);
  console.log("After splice (remove 2 add 100,200):", numbers);

  let clone = [...numbers];
  console.log("Cloned array using spread:", clone);

  let moreNumbers = [40, 50, 60];
  let merged = [...numbers, ...moreNumbers];
  console.log("Merged arrays:", merged);
}
</script>
</body>
</html>
