<!DOCTYPE html>
<html>
<head>
  <title> Basic JavaScript Program & Console</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 80px;">
  <h2>Task 1: Basic JavaScript Program & Console</h2>
  <p>Open your browser console (Right-click → Inspect → Console) to see the output.</p>

  <script>
    console.log("=== Task 1: Variables and Console Output ===");

    var name = "Srinithi";
    let age = 20;
    const country = "India";

    console.log("Name:", name);
    console.log("Age:", age);
    console.log("Country:", country);

    name = "Sri";  
    age = 21;      

    console.log("Updated Name:", name);
    console.log("Updated Age:", age);

    console.log("Message: JavaScript variables are flexible and powerful!");
  </script>
</body>
</html>
