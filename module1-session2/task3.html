
<!DOCTYPE html>
<html>
<head>
<title>Break and Continue Example</title>
</head>
<body>
<h2>Break and Continue Example</h2>

<label>Enter a range (max number): </label>
<input type="number" id="range" />
<button onclick="findPrime()">Find First Prime</button>
<p id="break"></p>

<button onclick="showOdds()">Show Odd Numbers</button>
<p id="continue"></p>

<script>
function findPrime() {
  let n = parseInt(document.getElementById("range").value);
  let num, isPrime;
  for (num = 2; num <= n; num++) {
    isPrime = true;
    for (let i = 2; i < num; i++) {
      if (num % i === 0) {
        isPrime = false;
        break;
      }
    }
    if (isPrime) {
      document.getElementById("break").innerHTML = "First prime number found: " + num;
      break;
    }
  }
}

function showOdds() {
  let result = "";
  for (let i = 1; i <= 20; i++) {
    if (i % 2 === 0) continue;
    result += i + " ";
  }
  document.getElementById("continue").innerHTML = "Odd numbers between 1 and 20: " + result;
}
</script>
</body>
</html>
