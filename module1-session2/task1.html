<!DOCTYPE html>
<html>
<head>
  <title>Conditional Statements Practice</title>
</head>
<body style="font-family: Arial; text-align:center; margin-top:50px;">
  <h2>Task 1: Conditional Statements Practice</h2>

  <h3>Simple If and If-Else</h3>
  <label>Enter a number:</label>
  <input type="number" id="num"><br><br>
  <button onclick="checkNumber()">Check Number</button>

  <h3>Multiple Conditions (Else-If)</h3>
  <label>Enter your marks (0–100):</label>
  <input type="number" id="marks"><br><br>
  <button onclick="checkGrade()">Check Grade</button>

  <h3>Switch Statement (Menu Example)</h3>
  <label>Enter day number (1–7):</label>
  <input type="number" id="day"><br><br>
  <button onclick="getDay()">Show Day</button>


  <div id="output" style="margin-top:40px; text-align:left; display:inline-block;"></div>

  <script>
    function checkNumber() {
      let num = parseFloat(document.getElementById("num").value);
      let res = "";
      if (num > 0) {
        res = num + " is Positive.";
      } else if (num < 0) {
        res = num + " is Negative.";
      } else {
        res = "The number is Zero.";
      }
      document.getElementById("output").innerHTML = res;
    }

    function checkGrade() {
      let marks = parseInt(document.getElementById("marks").value);
      let grade = "";
      if (marks >= 90) {
        grade = "Grade: A+";
      } else if (marks >= 75) {
        grade = "Grade: A";
      } else if (marks >= 60) {
        grade = "Grade: B";
      } else if (marks >= 40) {
        grade = "Grade: C";
      } else if (marks >= 0) {
        grade = "Grade: Fail";
      } else {
        grade = "Invalid Marks Entered!";
      }
      document.getElementById("output").innerHTML = grade;
    }

    function getDay() {
      let day = parseInt(document.getElementById("day").value);
      let dayName = "";
      switch (day) {
        case 1: dayName = "Sunday"; break;
        case 2: dayName = "Monday"; break;
        case 3: dayName = "Tuesday"; break;
        case 4: dayName = "Wednesday"; break;
        case 5: dayName = "Thursday"; break;
        case 6: dayName = "Friday"; break;
        case 7: dayName = "Saturday"; break;
        default: dayName = "Invalid day number (Enter 1–7)";
      }
      document.getElementById("output").innerHTML = "Day: " + dayName;
    }
  </script>
</body>
</html>
