<!DOCTYPE html>
<html>
<head>
  <title>Count Vowels in a String</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 80px;">
  <h2>Program 3: Count Vowels in a String</h2>

  <label>Enter a string:</label><br><br>
  <input type="text" id="textInput" placeholder="e.g. Hello World" style="width: 250px;"><br><br>

  <button onclick="countVowels()">Count Vowels</button>

  <h3 id="result"></h3>

  <script>
    function countVowels() {
      let str = document.getElementById("textInput").value;

      if (str.trim() === "") {
        document.getElementById("result").innerHTML = "⚠️ Please enter a string.";
        return;
      }

      let vowels = str.match(/[aeiouAEIOU]/g);
      let count = vowels ? vowels.length : 0;

      document.getElementById("result").innerHTML = "Number of vowels: " + count;
    }
  </script>
</body>
</html>
