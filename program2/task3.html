<!DOCTYPE html>
<html>
<head>
  <title>Guess the Number</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 80px;">
  <h2>Program 3: Guess the Number (Loop Until Correct)</h2>

  <button onclick="startGame()">Start Game</button>

  <h3 id="result"></h3>

  <script>
    function startGame() {
      let predefinedNumber = 75;
      let guess;
      do {
        guess = parseInt(prompt("Enter a number between 1 and 100:"));
        if (isNaN(guess)) {
          alert("Please enter a valid number.");
          continue;
        }

        if (guess < predefinedNumber) {
          alert("Too Low! Try again.");
        } else if (guess > predefinedNumber) {
          alert("Too High! Try again.");
        } else {
          alert("Correct!");
          document.getElementById("result").innerHTML = "You guessed it right! The number was " + predefinedNumber + ".";
        }
      } while (guess !== predefinedNumber);
    }
  </script>
</body>
</html>
