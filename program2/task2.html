<!DOCTYPE html>
<html>
<head>
  <title>Number Comparison</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 80px;">
  <h2>Program 2: Take User Input and Compare</h2>

  <label>Enter a number between 1 and 100:</label>
  <input type="number" id="userNumber" placeholder="Enter your number"><br><br>

  <button onclick="checkNumber()">Check</button>

  <h3 id="result"></h3>

  <script>
    let predefinedNumber = 50;

    function checkNumber() {
      let userNum = parseInt(document.getElementById("userNumber").value);

      if (isNaN(userNum)) {
        document.getElementById("result").innerHTML = "⚠️ Please enter a valid number.";
        return;
      }

      if (userNum < predefinedNumber) {
        document.getElementById("result").innerHTML = "Too Low!";
      } else if (userNum > predefinedNumber) {
        document.getElementById("result").innerHTML = "Too High!";
      } else {
        document.getElementById("result").innerHTML = "Correct!";
      }
    }
  </script>
</body>
</html>
