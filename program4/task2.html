<!DOCTYPE html>
<html>
<head>
  <title>Validate Email Field</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 80px;">
  <h2>Program: Validate Email Field</h2>

  <label>Enter your email:</label><br><br>
  <input type="text" id="emailInput" placeholder="e.g. test@example.com" style="width: 250px;"><br><br>

  <button onclick="validateEmail()">Validate</button>

  <h3 id="result"></h3>

  <script>
    function validateEmail() {
      let email = document.getElementById("emailInput").value.trim();
      let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (email === "") {
        document.getElementById("result").innerHTML = "⚠️ Email field cannot be empty.";
        return;
      }

      if (!pattern.test(email)) {
        document.getElementById("result").innerHTML = "❌ Invalid: Invalid email format.";
      } else {
        document.getElementById("result").innerHTML = "✅ " + email + " is valid.";
      }
    }
  </script>
</body>
</html>
