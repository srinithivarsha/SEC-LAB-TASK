<!DOCTYPE html>
<html>
<head>
<title>Function Examples</title>
</head>
<body>
<h2>Defining and Calling Functions</h2>
<button onclick="runFunctions()">Run Functions</button>
<p>output in console</p>

<script>
function add(a, b) {
  return a + b;
}

function multiply(a, b) {
  return a * b;
}

function sumAll(...nums) {
  let total = 0;
  for (let n of nums) total += n;
  return total;
}

function runFunctions() {
  console.clear();
  console.log("Addition of 5 and 3 =", add(5, 3));
  console.log("Multiplication of 4 and 6 =", multiply(4, 6));
  console.log("Sum of multiple numbers =", sumAll(1, 2, 3, 4, 5, 6));
}
</script>
</body>
</html>
